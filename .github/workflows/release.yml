name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the DMG and uploads it as an artifact, without publishing a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          PROJECT=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG%%-*}" != "$PROJECT" ]; then
              echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $PROJECT in project.yml"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PROJECT-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Notcholino.xcodeproj -scheme Notcholino \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Sign
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/Notcholino.app
          if [ -n "$SIGNING_P12" ]; then
            # Fixed self-signed identity: macOS keeps Keychain and privacy permissions across updates
            KC="$RUNNER_TEMP/sign.keychain-db"; KCPW="$(uuidgen)"
            echo "$SIGNING_P12" | base64 -d > "$RUNNER_TEMP/id.p12"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            # A self-signed certificate must be trusted for code signing before codesign accepts it
            security find-certificate -c "Notcholino Self-Signed" -p "$KC" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            codesign --force --deep --sign "Notcholino Self-Signed" --keychain "$KC" "$APP"
            rm -f "$RUNNER_TEMP/id.p12"
          else
            echo "::warning::No signing secrets: using an ad-hoc signature (macOS will ask for permissions again after each update)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP"

      - name: Create DMG
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          APP=build/Build/Products/Release/Notcholino.app
          DMG="Notcholino-$VERSION.dmg"
          rm -rf stage && mkdir stage && cp -R "$APP" stage/

          # Styled install window (Finder-driven, so retry a few times on a busy runner)
          ok=0
          for attempt in 1 2 3; do
            rm -f "$DMG"
            if create-dmg --volname "Notcholino" \
                 --volicon "$APP/Contents/Resources/AppIcon.icns" \
                 --background dmg/background.tiff \
                 --window-pos 200 120 --window-size 660 420 --icon-size 112 \
                 --icon "Notcholino.app" 180 200 \
                 --app-drop-link 480 200 \
                 --hide-extension "Notcholino.app" \
                 --no-internet-enable \
                 "$DMG" stage; then
              ok=1; break
            fi
            echo "create-dmg attempt $attempt failed"
            hdiutil detach -force /Volumes/Notcholino >/dev/null 2>&1 || true
            sleep 5
          done

          # Fall back to a plain DMG so a release is never blocked by cosmetics
          if [ "$ok" != 1 ]; then
            echo "::warning::Styled DMG failed, using a plain DMG"
            ln -s /Applications stage/Applications
            rm -f "$DMG"
            hdiutil create -volname Notcholino -srcfolder stage -ov -format UDZO "$DMG"
          fi

      - name: Upload DMG (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Notcholino-dmg
          path: Notcholino-*.dmg

      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v t="$TAG" '
            $0 ~ "^## \\[" t "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG entry for $TAG"; exit 1; fi

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "Notcholino-$VERSION.dmg" \
            --title "Notcholino $VERSION" --notes-file notes.md $FLAGS
