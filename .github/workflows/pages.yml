name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, plugins/**/plugin.json, plugins/**/media/**, plugins/**/CHANGELOG.md, scripts/gen_plugins_manifest.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate plugin manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_plugins_manifest.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
