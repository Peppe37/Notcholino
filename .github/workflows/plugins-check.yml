name: Plugins check

# Every plugin has what the store needs (fields of plugin.json, changelog section, pictures, a target in project.yml)
on:
  pull_request: # Required on main: always report the check, including for docs and app PRs.
  push:
    branches: [main]
    paths: [plugins/**, extensions/**, community/**, project.yml, scripts/**]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_plugins.py
