name: Notcholino
options:
  bundleIdPrefix: com.giuseppe
targets:
  Notcholino:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Notcholino
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Notcholino/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Notcholino needs Apple Events access to control music players."
        NSAppleScriptEnabled: true
        NSCalendarsFullAccessUsageDescription: "Notcholino needs access to display your upcoming events."
