name: Notcholino
options:
  bundleIdPrefix: com.giuseppe
targets:
  Notcholino:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Notcholino
      - Shared
      # Script that reads the system "Now Playing" through the helper framework (see third_party/mediaremote-adapter)
      - path: third_party/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
        link: false   # only loaded by the script, never linked
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "10"
    info:
      path: Notcholino/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Notcholino needs Apple Events access to control music players."
        NSAppleScriptEnabled: true
        NSCalendarsFullAccessUsageDescription: "Notcholino needs access to display your upcoming events."
        NSRemindersFullAccessUsageDescription: "Notcholino needs access to show the reminders due today."
  # --- Plugins (compiled as .bundle and loaded by the app at runtime) ---
  Espresso:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - plugins/espresso
      - Shared
    settings:
      base:
        PRODUCT_NAME: Espresso
        PRODUCT_BUNDLE_IDENTIFIER: com.giuseppe.Notcholino.plugin.espresso
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: EspressoPlugin
        MARKETING_VERSION: "0.1.0-alpha"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  # --- Helper framework for the system Now Playing (vendored, BSD-3-Clause) ---
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: third_party/mediaremote-adapter/src
        excludes:
          - "test/**"
      - path: third_party/mediaremote-adapter/include
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: com.giuseppe.Notcholino.mediaremoteadapter
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        # The Perl script looks the functions up by name, so they must stay exported
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: "-fvisibility=default"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/third_party/mediaremote-adapter/include $(SRCROOT)/third_party/mediaremote-adapter/src"
        OTHER_LDFLAGS: "-framework Foundation -framework AppKit -framework UniformTypeIdentifiers"
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
